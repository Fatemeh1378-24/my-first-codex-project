<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بررسی ثبت کامل نتایج</title><style>body{font:18px/1.9 Tahoma,Arial;background:#f3f5f8;padding:24px}main{max-width:760px;margin:8vh auto;background:white;padding:28px;border-radius:16px}button{font:inherit;background:#175ddc;color:white;border:0;border-radius:10px;padding:12px 24px;cursor:pointer}button:disabled{opacity:.6}#status{white-space:pre-line}</style><main><h1>بررسی ثبت کامل نتایج</h1><p>VPN خاموش باشد. این صفحه یک شرکت‌کنندهٔ ساختگی را دوبار ارسال می‌کند تا ثبت کامل و جلوگیری از تکرار بررسی شود. آزمون اصلی تغییر نمی‌کند.</p><button id="send">آزمایش ثبت کامل و جلوگیری از تکرار</button><p id="status" role="status" aria-live="polite"></p></main><script src="sheets-client.js"></script><script>
const sample={"participant_id": "SET_AT_RUNTIME", "group_number": 1, "age": 25, "gender": "زن", "education_level": "آزمایشی", "employment_status": "آزمایشی", "monthly_income": "آزمایشی", "religiosity": "آزمایشی", "block_1_mean_rt": 510, "block_2_mean_rt": 520, "block_3_mean_rt": 530, "block_4_mean_rt": 540, "block_5_mean_rt": 550, "block_6_mean_rt": 560, "block_7_mean_rt": 570, "d_score": 0.4, "d_short": 0.25, "d_long": 0.55, "percent_correct": 95, "prop_rt_300": 0.02, "exclude_criteria_met": false, "mean_rt_iranian_female": 510, "mean_rt_iranian_male": 580, "mean_rt_afghan_female": 530, "mean_rt_afghan_male": 600, "mean_rt_female_faces": 520, "mean_rt_male_faces": 590, "gender_rt_difference": 70, "same_gender_advantage": 70, "sdo_responses": {"sdo_01": 3, "sdo_02": 3, "sdo_03": 3, "sdo_04": 3, "sdo_05": 3, "sdo_06": 3, "sdo_07": 3, "sdo_08": 3, "sdo_09": 3, "sdo_10": 3, "sdo_11": 3, "sdo_12": 3, "sdo_13": 3, "sdo_14": 3, "sdo_15": 3, "sdo_16": 3}, "sdo_score": 3, "mfq_responses": {"mfq_01": 2, "mfq_02": 2, "mfq_03": 2, "mfq_04": 2, "mfq_05": 2, "mfq_06": 2, "mfq_07": 2, "mfq_08": 2, "mfq_09": 2, "mfq_10": 2, "mfq_11": 2, "mfq_12": 2, "mfq_13": 2, "mfq_14": 2, "mfq_15": 2, "mfq_16": 2, "mfq_17": 2, "mfq_18": 2, "mfq_19": 2, "mfq_20": 2, "mfq_21": 2, "mfq_22": 2, "mfq_23": 2, "mfq_24": 2, "mfq_25": 2, "mfq_26": 2, "mfq_27": 2, "mfq_28": 2, "mfq_29": 2, "mfq_30": 2, "mfq_31": 2, "mfq_32": 2, "mfq_33": 2, "mfq_34": 2, "mfq_35": 2, "mfq_36": 2}, "mfq_domain_scores": {"care": 2, "equality": 2, "proportionality": 2, "loyalty": 2, "authority": 2, "purity": 2}};
sample.participant_id=crypto.randomUUID();
const button=document.getElementById('send'),status=document.getElementById('status');
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='در حال بررسی؛ لطفاً صبر کنید…';try{
const first=await IAT_SHEETS.send(sample,'probe');
const second=await IAT_SHEETS.send(sample,'probe');
if(!first.saved||!second.saved||second.duplicate!==true||first.payload_sha256!==second.payload_sha256)throw new Error('dedup_failed');
status.textContent='ثبت کامل و جلوگیری از تکرار تأیید شد.\nشناسهٔ آزمایشی: '+sample.participant_id+'\nدر فایل IAT Results، زبانهٔ StorageChecks را بررسی کنید: باید برای این شناسه فقط یک ردیف باشد.\nنمرهٔ نهایی IAT: 0.4 — تفاوت زمان واکنش: 70 میلی‌ثانیه.';
}catch{status.textContent='تأیید ثبت کامل دریافت نشد. لطفاً از همین پیام عکس بفرستید. ممکن است نسخهٔ جدید Apps Script هنوز منتشر نشده باشد یا درخواست/پاسخ با خطا روبه‌رو شده باشد.';}finally{button.disabled=false;}});
</script></html>
